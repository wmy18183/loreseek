services:
  - type: web
    name: loreseek
    runtime: python
    plan: free
    region: singapore
    buildCommand: "echo no build step required"
    startCommand: "python main.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: LORESEEK_OA_EMAIL
        value: contact@loreseek.cn
